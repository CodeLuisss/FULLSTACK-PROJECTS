<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border</title>
    <style>
        h1{
            background-color: darkgoldenrod;
            border-bottom: 4px dotted black;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 8px;
        }
        p{
            background-color: lightsteelblue;
            border-left: 12px solid darkslateblue;
            border-right: 12px solid darkslateblue;
            border-radius: 20px;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h1>Modelo de Caixa</h1>

    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. 
        Expedita minima adipisci ad omnis tempora. Commodi similique aperiam, 
        velit minima expedita iusto porro quo incidunt atque ipsam, blanditiis architecto repellat in.
    </p>
</body>
</html>
