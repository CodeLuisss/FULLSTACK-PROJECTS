<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de texto</title>
</head>
<body>
    <h1>Formatação de Texto</h1>

    <p><b>Negrito</b></p>
    <p><strong>Negrito com Strong</strong></p>

    <p><u>Sublinhado</u></p>

    <p><mark>Marcado HighLight</mark></p>

    <p><small>Texto Pequeno</small></p>

    <p>Texto <sup>Sobrescrito</sup></p>
    
    <p>Texto <sub>Subescrito</sub></p>
</body>
</html>
