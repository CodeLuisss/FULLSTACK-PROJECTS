<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tabelas</h1>
    <table border="1">
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Profissão</th>
        </tr>
        <tr>
            <td>Luís</td>
            <td>21 anos</td>
            <td>Web Developer</td>
        </tr>
        <tr>
            <td>Carol</td>
            <td>25 anos</td>
            <td>Médica</td>
        </tr>
    </table>

    <table border="1">
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
        </tr>
        <tr>
            <td>Notebook</td>
            <td>1</td>
            <td>3900</td>
        </tr>
        <tr>
            <td>Ventilador</td>
            <td>2</td>
            <td>400</td>
        </tr>
        <tr>
            <td>Televisão</td>
            <td>4</td>
            <td>12000</td>
        </tr>
        <tr>
            <td rowspan="2">Desconto</td>
            <td colspan="2">200</td>
        </tr>
        <tr>
            <td colspan="2">400</td>
        </tr>
    </table>
</body>
</html>
